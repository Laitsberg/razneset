<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Что разнесут?">
  <!-- Родственник значка farymastats.info: тот же градиент с логотипа
       композитора и те же три полоски шкалы. Но третья разбита на
       многоточие: оценки ещё нет, есть только прогноз. Пунктирной
       обводкой пробовали — на маленьком значке она рвалась на
       скруглениях и читалась как мусор. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8400F"/>
      <stop offset="1" stop-color="#F0A02A"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <g fill="#1A1207">
    <rect x="13" y="17" width="38" height="8" rx="4"/>
    <rect x="13" y="28" width="26" height="8" rx="4"/>
  </g>
  <g fill="#1A1207">
    <rect x="13" y="39" width="7" height="8" rx="3.5"/>
    <rect x="23.5" y="39" width="7" height="8" rx="3.5"/>
    <rect x="34" y="39" width="7" height="8" rx="3.5"/>
  </g>
</svg>
